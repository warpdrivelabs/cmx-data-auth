# cmx-dataauth-server dev 配置（连远程开发库；与主 data-auth-server.toml 仅 [[databases]].db_url 不同）。
# 用法：CONFIG_FILE=data-auth-server-dev.toml ./dataauth.sh
# 注：db_url 为模板，按你的 dev 库实际地址/库名调整；schema 首启由 warm_store 自动建。

[server]
host = "0.0.0.0"
port = 8098
log_dir = "logs"
log_level = "info"
graceful_timeout_secs = 10

[[databases]]
db_id = "dataauth_pg"
db_name = "数据权限库(dev)"
db_type = "postgres"
db_url = "postgres://dbuser_dba:dbuser_dba@192.168.1.14:5432/cmx_fico"
default = true

[auth]
mode = "off"
# 接受门户反代注入的 M2M API Key（portal 的 outgoing_api_key）。engine-kit 收到 X-Api-Key 即强校验，
# 未登记则 401「无效 API Key」→ 前端误判登录失效踢回登录页。与 model/mdm/flow/report 保持一致。
api_keys = "cmx_sk_dev_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6"
tenancy = "single"
admin_roles = "superadmin,admin,dataauth-admin"
